  - name: product_color
    meaning: >
      Second color field. On every row it is identical to color,
      including when color is blank. It has no values of its own.
    values_same_as: color
    use_for: Same questions as color. Prefer color and do not join the two.
  - name: category_id
    meaning: >
      Product category. Always 30 in this table (this dress extract).
    values:
      - "30"
    do_not: Do not filter on it.
  - name: department_id
    meaning: >
      Department inside the category. Always 2 in this table.
    values:
      - "2"
    do_not: Do not filter on it.
  - name: product_id
    meaning: >
      Unique id of this colorway row. A new color of the same dress gets
      a new product_id. It is not shared by the colors of one style.
    values:
      kind: unique_per_row
      distinct: 8108
      listed: false
    do_not: Do not group by product_id to mean "one style."
