  - name: product_name
    meaning: >
      Style name. Together with brand, this is the style. Words in the
      name describe the silhouette and fabric (mini, midi, maxi, halter,
      satin, denim). There is no silhouette column.
    values:
      kind: open_text
      distinct: 5489
      listed: false
      overlaps_brand_exactly: 0
      overlaps_color_exactly: 0
    note: >
      The full name list is not pasted here. None of the names is exactly
      a brand or a color, so a phrase that is missing from those two lists
      is a product_name. Call get_values(column=product_name) for the
      stored spelling. The word Silhouette inside an Aritzia name is a
      fabric line, not the dress shape.
  - name: rank_absolute
    meaning: >
      Rank number from that retailer's own larger catalog. Smaller is better
      only inside one channel_id. The min and max on each channel_id above
      are the real scales. This number is not a position among the 8108 rows.
    values:
      kind: number
      min: 1
      max: 252247
      blank_rows: 0
      listed: false
    do_not: >
      Do not compare rank_absolute between retailers. Do not sort the
      whole table by rank_absolute and call the top row the best product.
      Use rank_percentile for any cross-retailer comparison.
  - name: rank_percentile
    meaning: >
      Selling strength on a shared 0 to 100 scale. Higher is better.
      About 100 is a top seller. About 0 is a weak seller. Use this to
      compare retailers, brands, colors, and silhouettes.
    values:
