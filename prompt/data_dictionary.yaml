# Description of the only table the model may query: products.
# One row is one colorway (one color of one style at one retailer).
# This file is pasted into the system prompt. It is not a query.
#
# Brand and color lists below are complete. Match those spellings exactly.
# product_name is not listed: 5489 names, and none equals a brand.
# If the user's words are not in the brand list, they belong to product_name.
# Look that name up with get_values. Do not invent it.

table: products
row_count: 8108

grain: >
  One row is one colorway: one color of one dress style at one retailer.
  _id and product_id are unique on every row. They identify the colorway,
  not the style.

what_a_style_is: >
  A style is brand plus product_name. The same style is several rows when
  it comes in several colors. Do not treat product_id, _id, or sku as the
  style id. sku is not unique: the same sku can appear on more than one color.

how_to_choose_the_column: >
  Decide the column before you write a filter.
  A retailer name (American Eagle, Zara, Aritzia) is channel_id, from the
  list below. The stored brand is often a different string: American Eagle's
  brand is AE, Zara's brand is ZARA, Hollister's brand is HOLLISTER.
  A value is a brand only when it appears in the brand list. Golden is the
  one value that is both a brand and a color. Use brand when the question
  names the Aritzia label Golden, and color when it names the color Golden.
  No product_name is exactly equal to a brand. Words that are not in the
  brand list and not in the color list are a product_name search.
  rank_label has only the four strings listed on that column.

scope: >
  Every row is category_id 30, department_id 2, and locale_id 1.
  This table is one dress category in one department. It does not contain
  other categories, departments, or locales.

rank_comparison: >
  Compare selling strength with rank_percentile or rank_label.
  Do not compare rank_absolute across retailers (across channel_id).
  Each retailer keeps its own rank scale. YesStyle rank_absolute reaches
  252247, while Vuori stays under 60, so rank 100 at one retailer is not
  "better" or "worse" than rank 100 at another. A smaller rank_absolute
  means a better rank only among rows that share the same channel_id.
  rank_absolute is also not the row's position inside this table.
  rank_percentile is 0 to 100 and is safe to compare across retailers.
  Higher percentile is better.

color_comparison: >
  color and product_color are the same string on every row of this table.
  Either column answers "what color is this row." There is no color-family
  column. Names such as Muted Navy and Navy do not match as text.
  When a question says black, navy, or pastel, group the listed color
  values into a family. Do not expect a value named pastel.

columns:
  - name: _id
    meaning: >
      Unique id of this row. One value per colorway. Not a style id.
      Not a brand, color, or product name.
    values:
      kind: unique_per_row
      distinct: 8108
      listed: false
    do_not: Do not group by _id when the question is about a style.
